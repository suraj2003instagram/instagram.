<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Login</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#fafafa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:350px;
    background:white;
    border:1px solid #dbdbdb;
    padding:40px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.logo{
    font-size:32px;
    font-weight:bold;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:5px;
    background:#0095f6;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0077cc;
}

.forgot{
    margin-top:15px;
}

a{
    text-decoration:none;
    color:#00376b;
}
</style>
</head>

<body>

<div class="login-box">
    <div <div class="logo-area">
    <img src="images (5).jpeg" width="40" alt="Logo" class="logo-img">
    <h2>Instagram</h2>
</div>

    <form>
        <input type="text" placeholder="Username or Mobile number" required>
        <input type="password" placeholder="Password" required>

        <button type="submit">Log In</button>
    </form>

    <div class="forgot">
        <a href="#">Forgot Password?</a>
    </div>
</div>

</body>
</html>
